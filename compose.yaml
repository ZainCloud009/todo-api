services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-api:latest
    container_name: todo-api-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./main.py:/app/main.py
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PORT=8000
